name: Auto Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Prevent loop when this workflow commits the version bump.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit version bump
        shell: pwsh
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): v$env:VERSION [skip ci]"
          git push origin HEAD:main

      - name: Build Windows installer
        run: npm run dist:win

      - name: Align latest.yml with uploaded asset naming
        shell: pwsh
        run: |
          $exeName = "Portefeuille IG Setup $env:VERSION.exe"
          $uploadedExeName = $exeName -replace ' ', '.'
          $latestPath = "release/latest.yml"
          $content = Get-Content $latestPath -Raw
          $content = $content.Replace($exeName, $uploadedExeName)
          Set-Content -Path $latestPath -Value $content -Encoding utf8

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $exeName = "Portefeuille IG Setup $env:VERSION.exe"
          gh release create $tag "release/$exeName" "release/$exeName.blockmap" "release/latest.yml" --repo "${{ github.repository }}" --title $tag --notes "Automated release $tag"
